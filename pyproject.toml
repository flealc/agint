[project]
name = "agint"
version = "0.1.0"
description = "Local personal assistant agent"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agint = "assistant.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"